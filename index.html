<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Board</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172554;
    }
    header {
      background: #173b80;
      color: white;
      padding: 28px 8%;
    }
    main { max-width: 1000px; margin: 30px auto; padding: 0 18px; }
    .filters, .form-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    input, select, textarea, button {
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    input, select, textarea { background: white; width: 100%; }
    .filters input { flex: 1; min-width: 180px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }
    .card, form {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0000000d;
    }
    .tag {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
    }
    button {
      background: #173b80;
      color: white;
      cursor: pointer;
      border: 0;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message, #formMessage { color: #475569; }
    .field { flex: 1 1 240px; }
    label { display: block; margin-bottom: 6px; }
    @media (max-width: 600px) {
      header { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Internship Board</h1>
    <p>Discover opportunities and start your career journey.</p>
  </header>

  <main>
    <h2>Explore Internships</h2>
    <div class="filters">
      <input id="search" type="search"
        placeholder="Search internships..." aria-label="Search internships">
      <select id="domain" aria-label="Filter by domain">
        <option value="all">All domains</option>
      </select>
    </div>

    <p id="message" role="status" aria-live="polite">Loading internships...</p>
    <button id="retry" type="button" hidden>Retry loading</button>
    <section class="cards" id="cards" aria-label="Internship listings"></section>

    <h2>Apply for an Internship</h2>
    <form id="applicationForm">
      <div class="form-grid">
        <div class="field">
          <label for="internship">Internship</label>
          <select id="internship" name="internshipId" required>
            <option value="">Select an internship</option>
          </select>
        </div>
        <div class="field">
          <label for="applicantName">Full name</label>
          <input id="applicantName" name="applicantName"
            required minlength="2" maxlength="100">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email"
            required maxlength="254">
        </div>
      </div>
      <label for="coverLetter">Why are you applying?</label>
      <textarea id="coverLetter" name="coverLetter"
        required minlength="20" maxlength="2000" rows="4"></textarea>
      <p id="formMessage" role="status" aria-live="polite"></p>
      <button id="submitButton" type="submit">Submit application</button>
    </form>
  </main>

<script src="/app.js" defer></script>
</body>
</html>
