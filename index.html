<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Board</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172554;
    }
    header {
      background: #173b80;
      color: white;
      padding: 28px 8%;
    }
    main { max-width: 1000px; margin: 30px auto; padding: 0 18px; }
    .filters, .form-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    input, select, textarea, button {
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    input, select, textarea { background: white; width: 100%; }
    .filters input { flex: 1; min-width: 180px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }
    .card, form {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0000000d;
    }
    .tag {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
    }
    button {
      background: #173b80;
      color: white;
      cursor: pointer;
      border: 0;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message, #formMessage { color: #475569; }
    .field { flex: 1 1 240px; }
    label { display: block; margin-bottom: 6px; }
    @media (max-width: 600px) {
      header { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Internship Board</h1>
    <p>Discover opportunities and start your career journey.</p>
  </header>

  <main>
    <h2>Explore Internships</h2>
    <div class="filters">
      <input id="search" type="search"
        placeholder="Search internships..." aria-label="Search internships">
      <select id="domain" aria-label="Filter by domain">
        <option value="all">All domains</option>
      </select>
    </div>

    <p id="message" role="status" aria-live="polite">Loading internships...</p>
    <button id="retry" type="button" hidden>Retry loading</button>
    <section class="cards" id="cards" aria-label="Internship listings"></section>

    <h2>Apply for an Internship</h2>
    <form id="applicationForm">
      <div class="form-grid">
        <div class="field">
          <label for="internship">Internship</label>
          <select id="internship" name="internshipId" required>
            <option value="">Select an internship</option>
          </select>
        </div>
        <div class="field">
          <label for="applicantName">Full name</label>
          <input id="applicantName" name="applicantName"
            required minlength="2" maxlength="100">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email"
            required maxlength="254">
        </div>
      </div>
      <label for="coverLetter">Why are you applying?</label>
      <textarea id="coverLetter" name="coverLetter"
        required minlength="20" maxlength="2000" rows="4"></textarea>
      <p id="formMessage" role="status" aria-live="polite"></p>
      <button id="submitButton" type="submit">Submit application</button>
    </form>
  </main>

  <script>
    const API = "/api";
    const cards = document.getElementById("cards");
    const search = document.getElementById("search");
    const domain = document.getElementById("domain");
    const message = document.getElementById("message");
    const retry = document.getElementById("retry");
    const internshipSelect = document.getElementById("internship");
    const form = document.getElementById("applicationForm");
    const formMessage = document.getElementById("formMessage");
    const submitButton = document.getElementById("submitButton");

    let internships = [];

    function addText(parent, tagName, text, className) {
      const element = document.createElement(tagName);
      element.textContent = text;
      if (className) element.className = className;
      parent.appendChild(element);
      return element;
    }

    async function loadInternships() {
      message.textContent = "Loading internships...";
      retry.hidden = true;
      cards.replaceChildren();

      try {
        const response = await fetch(`${API}/internships`);
        if (!response.ok) throw new Error("Unable to load internships.");

        const result = await response.json();
        if (!Array.isArray(result.data)) throw new Error("Invalid API response.");

        internships = result.data;
        const previousDomain = domain.value;

        domain.replaceChildren();
        const all = document.createElement("option");
        all.value = "all";
        all.textContent = "All domains";
        domain.appendChild(all);

        [...new Set(internships.map(item => item.domain))].forEach(value => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          domain.appendChild(option);
        });

        if ([...domain.options].some(option => option.value === previousDomain)) {
          domain.value = previousDomain;
        }

        internshipSelect.replaceChildren();
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Select an internship";
        internshipSelect.appendChild(placeholder);

        internships.forEach(item => {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = `${item.title} — ${item.company}`;
          internshipSelect.appendChild(option);
        });

        render();
      } catch (err) {
        message.textContent = "Could not load internships. Check your connection and try again.";
        retry.hidden = false;
      }
    }

    function render() {
      const term = search.value.trim().toLowerCase();
      const selected = domain.value;
      const results = internships.filter(item =>
        (selected === "all" || item.domain === selected) &&
        [item.title, item.company, item.domain, item.location]
          .join(" ").toLowerCase().includes(term)
      );

      cards.replaceChildren();

      if (!results.length) {
        message.textContent = "No internships found. Try another search.";
        return;
      }

      message.textContent = `${results.length} internship opportunities found`;

      results.forEach(item => {
        const card = document.createElement("article");
        card.className = "card";
        addText(card, "h3", item.title);
        addText(card, "p", item.company);
        addText(card, "span", item.domain, "tag");
        addText(card, "p", `Location: ${item.location}`);
        addText(card, "p", item.description);
        const button = addText(card, "button", "Apply");
        button.type = "button";
        button.addEventListener("click", () => {
          internshipSelect.value = String(item.id);
          form.scrollIntoView({ behavior: "smooth" });
        });
        cards.appendChild(card);
      });
    }

    retry.addEventListener("click", loadInternships);
    search.addEventListener("input", render);
    domain.addEventListener("change", render);

    form.addEventListener("submit", async event => {
      event.preventDefault();
      formMessage.textContent = "";

      if (!form.reportValidity()) return;

      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";

      const payload = {
        internshipId: Number(internshipSelect.value),
        applicantName: document.getElementById("applicantName").value.trim(),
        email: document.getElementById("email").value.trim(),
        coverLetter: document.getElementById("coverLetter").value.trim()
      };

      try {
        const response = await fetch(`${API}/applications`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error?.message || "Application failed.");
        }

        formMessage.textContent = "Application submitted successfully.";
        form.reset();
      } catch (err) {
        formMessage.textContent = `${err.message} Please check your details and retry.`;
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Submit application";
      }
    });

    loadInternships();
  </script>
</body>
</html>
